name: Docker server image

# Build the standalone HanaAgent server Docker image and (optionally) push it
# to GitHub Container Registry (ghcr.io). Manual trigger only — runs on
# `workflow_dispatch`.
#
# Inputs:
#   version  If provided (e.g. "0.451.0"), the workflow re-tags the freshly
#            built image as `v<version>` and `:latest`, pushes both to ghcr.io,
#            and flips the package visibility to public. If left blank the
#            workflow only runs the build step (handy for verifying the image
#            builds without publishing).
#
# After a successful run with `version` set, a VPS that runs
#   docker compose pull && docker compose up -d
# picks up the new image. Pin a specific release by exporting
# IMAGE_TAG=v0.451.0 before `docker compose up`.
#
# Local-build convenience: on a Linux host with Node 24 + Docker, you can skip
# this workflow entirely and run
#   node scripts/build-server-docker-image.mjs
# which builds the same image locally.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag without leading 'v' (e.g. 0.451.0). Leave blank to build only without pushing."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Install npm dependencies
        run: npm ci

      # Renderer assets are required by scripts/build-server-runtime-assets.mjs:
      # `copyServerRuntimeAssets` hard-asserts `desktop/dist-renderer/` exists
      # when assembling the full-composition server tree. `npm run build:client`
      # also rebuilds main/preload/splash/theme, which are Electron-only and
      # unrelated to the server image, so we run just the renderer step.
      - name: Build renderer assets
        run: npm run build:renderer

      # `scripts/build-server-docker-image.mjs` already wraps
      # `scripts/build-server.mjs linux x64` (artifact build) + `docker build`,
      # and tolerates `packDualKindSeed`'s Apple-notary failure on Linux
      # because the artifact on disk is already complete by then.
      - name: Build server image
        run: node scripts/build-server-docker-image.mjs

      - name: Smoke-test image
        run: |
          # Run the built image briefly and confirm it starts up.
          docker run --rm --detach \
            --name hanaagent-smoke \
            -e HANA_HOME=/hana/home \
            -e HANA_INTERNAL_STANDALONE_RUNTIME_SMOKE=1 \
            hanako:dev-$(git rev-parse --short HEAD) \
            || (echo "container failed to start"; exit 1)
          sleep 5
          docker logs hanaagent-smoke || true
          docker stop hanaagent-smoke || true

      - name: Skip publish (no version input)
        id: skip
        if: inputs.version == ''
        run: |
          echo "No version provided; skipping push."
          echo "skipped=true" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        if: inputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag and push
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)
          SHA=$(git rev-parse --short HEAD)
          for t in "v${VERSION}" latest; do
            docker tag "hanako:dev-${SHA}" "ghcr.io/${OWNER}/${REPO}:${t}"
            docker push "ghcr.io/${OWNER}/${REPO}:${t}"
          done

      - name: Set package visibility to public
        if: inputs.version != ''
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try both endpoints: user-owned packages use /users/{owner}/packages,
          # org-owned packages use /orgs/{owner}/packages. One will 404; the
          # other succeeds. We don't fail the workflow if visibility flip
          # fails — the push above already succeeded, and a private package
          # can still be pulled with `docker login ghcr.io`.
          set +e
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --user "${OWNER}:${TOKEN}" \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${OWNER}/packages/container/${REPO}" \
            -d '{"visibility":"public"}')
          if [ "$STATUS" != "200" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --user "${OWNER}:${TOKEN}" \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${REPO}" \
              -d '{"visibility":"public"}')
          fi
          echo "visibility flip HTTP status: $STATUS"
