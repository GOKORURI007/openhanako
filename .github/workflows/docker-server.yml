name: Docker server image

# Build the standalone HanaAgent server Docker image on every push to main,
# and on a manual dispatch re-tag the most recent build and push it to
# GitHub Container Registry (ghcr.io) so a plain `docker compose pull && up`
# on the production VPS is enough to roll forward.
#
# Local-build convenience: on the build host (the Linux machine with Node 24
# and Docker) you can skip this workflow entirely and run
#   node scripts/build-server-docker-image.mjs
# which builds the same image and tags it hanako:dev-<sha>. CI just adds the
# registry leg.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.451.0). Leave blank to skip the publish step and only refresh the build cache."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Install npm dependencies
        run: npm ci

      # `scripts/build-server-docker-image.mjs` already wraps
      # `scripts/build-server.mjs linux x64` (artifact build) + `docker build`,
      # and tolerates `packDualKindSeed`'s Apple-notary failure on Linux
      # because the artifact on disk is already complete by then.
      - name: Build server image
        run: |
          node scripts/build-server-docker-image.mjs
          SHA=$(git rev-parse --short HEAD)
          echo "image-tag=hanako:dev-$SHA" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag and push
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)
          # Make the package public so a VPS can `docker pull` without login.
          # (Visibility change needs packages: write on the job; token above
          # already grants that.)
          for t in "v${VERSION}" latest; do
            docker tag "hanako:dev-${SHA}" "ghcr.io/${OWNER}/${REPO}:${t}"
            docker push "ghcr.io/${OWNER}/${REPO}:${t}"
          done
          # Best-effort: flip the package to public via the GitHub API. If
          # this fails (e.g. organisation policy disallows public packages),
          # the push above still succeeds and operators can `docker login
          # ghcr.io` with a token that has packages: read.
          curl --silent --show-error --fail \
            --user "${OWNER}:${{ secrets.GITHUB_TOKEN }}" \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/orgs/${OWNER}/packages/container/${REPO} \
            -d '{"visibility":"public"}' || true