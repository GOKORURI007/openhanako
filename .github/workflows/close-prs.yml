name: Close Pull Request

# Manual escape hatch for closing a pull request: post a notice comment and
# mark the PR closed. The original auto-close behaviour (on every opened PR)
# was changed to manual-only so maintainers stay in control.
#
# Inputs:
#   pr_number  Pull request number to close.
#   dry_run    If true, print the plan but make no remote writes.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to close"
        required: true
        type: string
      dry_run:
        description: "Print plan only; make no remote writes"
        required: false
        type: boolean
        default: false

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ inputs.pr_number }}', 10);
            if (!Number.isFinite(prNumber)) {
              core.setFailed(`Invalid pr_number: ${{ inputs.pr_number }}`);
              return;
            }
            const dryRun = ${{ inputs.dry_run }};

            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Don't close PRs from the repo owner.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.data.user.login === repo.data.owner.login) {
              core.notice(`PR #${prNumber} is from the repo owner; skipping.`);
              return;
            }

            const commentBody = '感谢你的关注！项目目前处于早期阶段，暂不接受 Pull Request。如果你有想法或发现了问题，欢迎开 issue 讨论。';

            if (dryRun) {
              core.notice(`[dry-run] would comment and close PR #${prNumber}`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              state: 'closed',
            });
            core.notice(`Closed PR #${prNumber}.`);