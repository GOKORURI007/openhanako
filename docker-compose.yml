# docker-compose.yml — standalone HanaAgent server on a Linux host.
#
# Default image is the registry build pushed by .github/workflows/docker-server.yml
# (ghcr.io/gokoruri007/openhanako:latest). The CI workflow re-tags and pushes
# on a manual workflow_dispatch with a `version` input; every push to main
# refreshes the build cache. VPS therefore only needs `docker compose pull && up`.
#
# Quickstart on the VPS (LLM provider keys are configured through the web UI
# after first start — no host-side secret file is needed):
#
#   git clone https://github.com/GOKORURI007/openhanako.git
#   cd openhanako
#   docker compose pull
#   docker compose up -d
#   # Open https://hanako.example.com and complete the onboarding flow
#   # (Settings → Providers → add provider + API key). The key is written to
#   # the hana-data volume and survives container restarts.
#   docker compose logs -f
#
# To pin a specific release version instead of :latest:
#
#   export IMAGE_TAG=v0.451.0
#   docker compose pull && docker compose up -d
#
# To build the image locally on the same Linux host (skip CI entirely):
#
#   node scripts/build-server-docker-image.mjs
#   docker compose -f docker-compose.local.yml up -d
#
# (docker-compose.local.yml is not provided; create it yourself with
#  `image: hanako:dev-${short_sha}` if you want local-only builds.)
#
# Reverse-proxy / TLS termination are intentionally *outside* this container.
# Bind 7777 to 127.0.0.1 on the host and let nginx / Caddy / Cloudflare Tunnel
# handle the public face.
#
# Reverse-proxy / TLS termination are intentionally *outside* this container.
# Bind 7777 to 127.0.0.1 on the host and let nginx / Caddy / Cloudflare Tunnel
# handle the public face.

name: hanaagent

services:
  hanaagent:
    # Default to the published ghcr.io image. To pin a specific version:
    #   export IMAGE_TAG=v0.451.0
    # To use a locally-built image instead (Linux host only):
    #   docker compose -f docker-compose.local.yml up
    image: ghcr.io/gokoruri007/openhanako:${IMAGE_TAG:-latest}
    container_name: hanaagent
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      HANA_HOME: /hana/home
      HOST: 0.0.0.0
      PORT: 7777
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    volumes:
      - hana-data:/hana/home
      - ./hana-config.yaml:/etc/hanaagent/config.yaml:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - KILL
    security_opt:
      - no-new-privileges:false
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "require(''http'').get(''http://127.0.0.1:7777/api/health'',r=>process.exit(r.statusCode<500?0:1)).on(''error'',()=>process.exit(1))"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  hana-data: