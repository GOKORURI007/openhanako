# docker-compose.yml — standalone HanaAgent server on a Linux host.
#
# End-to-end flow on the build host (Linux x64, Node 24 in PATH, Docker installed):
#
#   # 1. Build the local server artifact and Docker image in one step.
#   node scripts/build-server-docker-image.mjs
#
#   # 2. (Optional) Override IMAGE_TAG (default: tag written by step 1).
#   export IMAGE_TAG=dev
#
#   # 3. Edit the `secrets:` block below to point at a real file. Compose v2
#   #    treats the file as a tmpfs-mounted secret and never writes it to disk.
#   mkdir -p secrets && echo "$YOUR_LLM_API_KEY" > secrets/llm_api_key.txt
#
#   # 4. (Optional) Mount a structured config file at /etc/hanaagent/config.yaml.
#   cp examples/hana-config.example.yaml hana-config.yaml && $EDITOR hana-config.yaml
#
#   # 5. Start.
#   docker compose up -d
#
#   # 6. Tail logs.
#   docker compose logs -f
#
# Reverse-proxy / TLS termination are intentionally *outside* this container.
# Bind 7777 to 127.0.0.1 on the host and let nginx / Caddy / Cloudflare Tunnel
# handle the public face.

name: hanaagent

services:
  hanaagent:
    image: hanako:${IMAGE_TAG:-dev}
    container_name: hanaagent
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      HANA_HOME: /hana/home
      HOST: 0.0.0.0
      PORT: 7777
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    volumes:
      - hana-data:/hana/home
      - ./hana-config.yaml:/etc/hanaagent/config.yaml:ro
    secrets:
      - llm_api_key
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - KILL
    security_opt:
      - no-new-privileges:false
    healthcheck:
      test:
        - node
        - -e
        - "require('http').get('http://127.0.0.1:7777/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  hana-data:

secrets:
  llm_api_key:
    file: ./secrets/llm_api_key.txt